<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00898a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>AI Tracker</title>
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.teal.min.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({
                appId: "18d1e593-4b61-4987-befb-c5933694288b", 
                safari_web_id: "web.onesignal.auto.220e9b0b-02d4-465b-a5d3-49d3d287ceee", 
                notifyButton: { enable: true, position: 'bottom-left', offset: { bottom: '85px', right: '15px' } },
                serviceWorkerParam: { scope: "/" },
                serviceWorkerPath: "sw.js"
            });
            OneSignal.Slidedown.promptPush();
        });
    </script>
    
    <style>
        /* 1. Opaque Structural Viewports (Fixes Content Scroll Overlaps) */
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: var(--pico-background-color); }
        .app-container { max-width: 600px; margin: 0 auto; background: var(--pico-background-color); min-height: 100vh; position: relative; }
        
        main#app-content { 
            display: block; 
            padding: 160px 12px 95px 12px; /* Fixed structural safety windows for structural headers/footers */
        }
        
        /* 2. Absolute Opaque Isolation for PIN Lock Frame (Fixes Bleeding Screens) */
        #pin-overlay { 
            position: fixed; 
            inset: 0; 
            background-color: var(--pico-background-color) !important; 
            z-index: 999999 !important; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
        }
        .pin-dots-row { display: flex; gap: 1.5rem; margin-bottom: 2.5rem; justify-content: center; align-items: center; height: 20px; }
        .pin-circle { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--pico-muted-border-color); background: transparent; transition: background 0.1s ease; }
        
        .pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; max-width: 260px; width: 100%; place-items: center; }
        .pin-keypad button { width: 72px; height: 72px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; background: transparent; border: 1px solid var(--pico-muted-border-color); color: var(--pico-color); box-shadow: none; -webkit-tap-highlight-color: transparent; margin: 0; }
        .pin-keypad button:active { background: var(--pico-form-element-background-color); }
        
        /* 3. Splash Viewports */
        #native-splash { position: fixed; inset: 0; z-index: 999998; background-color: var(--pico-background-color); display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.4s ease; }
        .spinner-ring { width: 48px; height: 48px; border: 4px solid var(--pico-muted-border-color); border-top-color: var(--pico-primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #app-root { visibility: hidden; opacity: 0; transition: opacity 0.4s ease; }
        
        /* 4. Opaque Roof Header Block */
        .fixed-header-roof { 
            position: fixed; 
            top: 0; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 100%; 
            max-width: 600px; 
            z-index: 1000; 
            background-color: var(--pico-background-color);
            border-bottom: 1px solid var(--pico-muted-border-color); 
            padding-top: 8px; 
        }
        .header-grid { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; text-align: center; padding: 0 12px; }
        .header-grid button { background: transparent; border: none; color: var(--pico-color); padding: 0; margin: 0; width: auto; box-shadow: none; }
        .header-grid h1 { margin: 0; font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 800; }
        
        /* Sub Navigation Elements */
        .sub-nav { display: flex; justify-content: space-around; padding-top: 4px; }
        .sub-nav button { flex: 1; background: transparent; border: none; border-bottom: 3px solid transparent; color: var(--pico-muted-color); border-radius: 0; padding: 8px 4px; margin: 0; box-shadow: none; font-size: 0.72rem; font-weight: bold; text-transform: uppercase; }
        .sub-nav button.active { color: var(--pico-primary); border-bottom: 3px solid var(--pico-primary); }

        .profile-toggle { display: flex; justify-content: center; margin-top: 6px; padding-bottom: 4px; }
        .profile-toggle-inner { display: flex; background: var(--pico-form-element-background-color); border-radius: 20px; padding: 3px; width: 220px; position: relative; }
        .profile-toggle-inner button { flex: 1; margin: 0; padding: 5px 0; font-size: 0.7rem; font-weight: bold; border: none; background: transparent; color: var(--pico-muted-color); box-shadow: none; z-index: 2; }
        .profile-toggle-inner button.active { color: var(--pico-primary-inverse); }
        .toggle-slider { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); background: var(--pico-primary); border-radius: 20px; transition: transform 0.25s ease; z-index: 1; }

        /* 5. Clean Custom Semantic Lists (Recreating Row Hierarchies) */
        .card { background: var(--pico-card-background-color); border: 1px solid var(--pico-muted-border-color); border-radius: 8px; margin-bottom: 1rem; overflow: hidden; }
        .card-header { padding: 12px 16px; text-align: center; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: var(--pico-muted-color); letter-spacing: 1px; border-bottom: 1px solid var(--pico-muted-border-color); background: var(--pico-form-element-background-color); }
        
        .list-container { list-style: none; padding: 0; margin: 0; }
        .list-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--pico-muted-border-color); }
        .list-row:last-child { border-bottom: none; }
        
        /* 6. Text Elements & Data Clones */
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .text-sm { font-size: 0.85rem; }
        .text-xs { font-size: 0.75rem; }
        .text-muted { color: var(--pico-muted-color); }
        .font-bold { font-weight: bold; }
        .text-green { color: #10b981 !important; font-weight: bold; }
        .text-red { color: #ef4444 !important; font-weight: bold; }
        .pill { background: var(--pico-primary); color: var(--pico-primary-inverse); padding: 4px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: bold; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex-col { display: flex; flex-direction: column; }
        
        /* 7. Precision Adaptive Tables */
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table.compact { width: 100%; font-size: 0.75rem; margin: 0; border-collapse: collapse; }
        table.compact th, table.compact td { padding: 10px 8px; border-bottom: 1px solid var(--pico-muted-border-color); }
        table.compact th { color: var(--pico-muted-color); text-transform: uppercase; font-weight: bold; font-size: 0.65rem; letter-spacing: 0.5px; background: var(--pico-form-element-background-color); }
        
        /* 8. Accordions Viewports */
        details { background: var(--pico-card-background-color); border: 1px solid var(--pico-muted-border-color); border-radius: 8px; margin-bottom: 0.5rem; overflow: hidden; }
        details summary { padding: 14px 16px; font-weight: bold; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        details summary::-webkit-details-marker { display: none; }
        details[open] summary { border-bottom: 1px solid var(--pico-muted-border-color); background: var(--pico-form-element-background-color); }
        details > div { padding: 0; background: var(--pico-background-color); }

        /* 9. Fixed Bottom Opaque Foot Bar */
        nav.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; height: 75px; background-color: var(--pico-background-color); border-top: 1px solid var(--pico-muted-border-color); display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding: 0; margin: 0; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
        nav.bottom-nav button { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; border: none; color: var(--pico-muted-color); border-radius: 0; padding: 0; margin: 0; box-shadow: none; gap: 4px; }
        nav.bottom-nav button.active { color: var(--pico-primary); }
        nav.bottom-nav button span { font-size: 0.65rem; font-weight: bold; letter-spacing: 0.5px; }
        nav.bottom-nav svg { width: 22px; height: 22px; }
        
        /* 10. Floating Utilities */
        .fab-container { position: fixed; bottom: 85px; right: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 900; }
        @media (min-width: 600px) { .fab-container { right: calc(50% - 285px); } }
        .fab { width: 45px; height: 45px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; transform: translateY(10px); background: var(--pico-primary); color: var(--pico-primary-inverse); box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: none; }
        .fab.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .loader { border: 2px solid var(--pico-muted-border-color); border-top: 2px solid var(--pico-primary-inverse); border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
    </style>
</head>
<body>

    <div id="native-splash">
        <div class="spinner-ring"></div>
        <p style="margin-top:20px; font-weight:bold; letter-spacing:2px; font-size:0.75rem; color: var(--pico-muted-color);">LOADING PORTFOLIO</p>
    </div>

    <div id="pin-overlay">
        <h2 style="margin-bottom:2rem; font-weight:bold; font-size:1.4rem; color:var(--pico-color); tracking-wide">Enter PIN</h2>
        <div class="pin-dots-row">
            <div class="pin-circle"></div>
            <div class="pin-circle"></div>
            <div class="pin-circle"></div>
            <div class="pin-circle"></div>
        </div>
        <p id="pin-error" style="color: #ef4444; display: none; margin-bottom: 1.5rem; font-weight: bold; font-size: 0.85rem;">Incorrect PIN.</p>
        <div class="pin-keypad">
            <button onclick="handlePinInput('1')">1</button>
            <button onclick="handlePinInput('2')">2</button>
            <button onclick="handlePinInput('3')">3</button>
            <button onclick="handlePinInput('4')">4</button>
            <button onclick="handlePinInput('5')">5</button>
            <button onclick="handlePinInput('6')">6</button>
            <button onclick="handlePinInput('7')">7</button>
            <button onclick="handlePinInput('8')">8</button>
            <button onclick="handlePinInput('9')">9</button>
            <div></div>
            <button onclick="handlePinInput('0')">0</button>
            <button onclick="handlePinInput('clear')">
                <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9.75L14.25 12m0 0l2.25 2.25M14.25 12l2.25-2.25M14.25 12L12 14.25m-2.58 4.92l-6.375-6.375a1.125 1.125 0 010-1.59L9.42 4.83c.211-.211.498-.33.796-.33H19.5a2.25 2.25 0 012.25 2.25v10.5a2.25 2.25 0 01-2.25 2.25h-9.284c-.298 0-.585-.119-.796-.33z"/></svg>
            </button>
        </div>
    </div>

    <div id="app-root" class="app-container">
        
        <div class="fixed-header-roof">
            <header class="header-grid">
                <button onclick="toggleTheme()"><svg id="theme-icon" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"></svg></button>
                <div>
                    <h1 id="header-title">Home</h1>
                    <div id="global-stats" class="text-muted text-xs font-bold" style="margin-top:2px;">Initializing...</div>
                </div>
                <button onclick="togglePrivacy()"><svg id="privacy-icon" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"></svg></button>
            </header>
            
            <div id="profile-toggle" class="profile-toggle" style="display: none;">
                <div class="profile-toggle-inner">
                    <div id="toggle-slider" class="toggle-slider"></div>
                    <button onclick="switchUser('HT')" id="btn-user-ht" class="active">HITESH</button>
                    <button onclick="switchUser('NCT')" id="btn-user-nct">NEHA</button>
                </div>
            </div>
            
            <div id="sub-nav" class="sub-nav"></div>
        </div>

        <main id="app-content"></main>

        <div id="loading-spinner" style="display:none; justify-content:center; padding: 3rem;">
            <article aria-busy="true" style="background:transparent; border:none; box-shadow:none; margin:0;"></article>
        </div>

        <div class="fab-container">
            <button id="fab-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fab">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"></path></svg>
            </button>
            <button id="fab-back" onclick="switchMainTab('home')" class="fab" style="display: none; background: var(--pico-muted-color);">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m7 7l-7-7 7-7"></path></svg>
            </button>
        </div>

        <nav class="bottom-nav">
            <button onclick="switchMainTab('home')" id="nav-home">
                <svg fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011-1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                <span>HOME</span>
            </button>
            <button onclick="switchMainTab('fds')" id="nav-fds">
                <svg fill="currentColor" viewBox="0 0 20 20"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"></path></svg>
                <span>FDs</span>
            </button>
            <button onclick="switchMainTab('ncd')" id="nav-ncd">
                <svg fill="currentColor" viewBox="0 0 20 20"><path d="M4 3a2 2 0 100 4h12a2 2 0 100-4H4z"></path><path fill-rule="evenodd" d="M3 8h14v7a2 2 0 01-2 2H5a2 2 0 01-2-2V8zm5 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" clip-rule="evenodd"></path></svg>
                <span>NCDs</span>
            </button>
            <button onclick="switchMainTab('mf')" id="nav-mf">
                <svg fill="currentColor" viewBox="0 0 20 20"><path d="M2 10a8 8 0 018-8v8h8a8 8 0 11-16 0z"></path><path d="M12 2.252A8.014 8.014 0 0117.748 8H12V2.252z"></path></svg>
                <span>MFs</span>
            </button>
            <button onclick="switchMainTab('cash')" id="nav-cash">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12"/><path d="M6 8h12"/><path d="M6 13l8.5 8"/><path d="M6 13a3 3 0 0 0 0-5"/></svg>
                <span>CASH</span>
            </button>
            <button onclick="switchMainTab('nps')" id="nav-nps">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>NPS</span>
            </button>
        </nav>
    </div>

    <script>
        let touchstartX = 0; let touchendX = 0; let touchstartY = 0; let touchendY = 0;
        window.addEventListener('DOMContentLoaded', () => {
            applyInitialTheme();
            const root = document.getElementById('app-root');
            const splash = document.getElementById('native-splash');
            root.style.visibility = 'visible'; root.style.opacity = '1';
            setTimeout(() => { if (splash) splash.style.display = 'none'; }, 400);

            if (sessionStorage.getItem('isUnlocked') === 'true') {
                document.getElementById('pin-overlay').style.display = 'none';
                init(); 
            } else {
                updatePinDisplay();
            }

            const contentBlock = document.getElementById('app-content');
            contentBlock.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; touchstartY = e.changedTouches[0].screenY; }, {passive: true});
            contentBlock.addEventListener('touchend', e => {
                touchendX = e.changedTouches[0].screenX; touchendY = e.changedTouches[0].screenY;
                const isScrollableTable = e.target.closest('.table-wrapper');
                if (isScrollableTable && isScrollableTable.scrollWidth > isScrollableTable.clientWidth) return; 
                handleSwipeDirection();
            }, {passive: true});
            
            window.addEventListener('scroll', () => {
                const fabTop = document.getElementById('fab-top');
                if (!fabTop) return;
                if (window.scrollY > 150) fabTop.classList.add('visible');
                else fabTop.classList.remove('visible');
            }, { passive: true });
        });

        function handleSwipeDirection() {
            const dx = touchendX - touchstartX; const dy = touchendY - touchstartY;
            if (Math.abs(dy) > Math.abs(dx)) return;
            
            const homeViews = ['dashboard', 'networth', 'tickers'];
            const otherViews = ['maturity', 'bank'];
            const mfViews = ['dashboard', 'details'];
            
            let activeViews = [];
            if (currentTab === 'home') activeViews = homeViews;
            else if (currentTab === 'mf') activeViews = mfViews;
            else if (currentTab !== 'cash' && currentTab !== 'nps') activeViews = otherViews;
            
            if(activeViews.length === 0) return;
            const currentIndex = activeViews.indexOf(currentSubView);
            const swipeThreshold = 50; 
            
            if (dx < -swipeThreshold && currentIndex < activeViews.length - 1) { showSubView(activeViews[currentIndex + 1]); } 
            else if (dx > swipeThreshold && currentIndex > 0) { showSubView(activeViews[currentIndex - 1]); }
        }

        const API_URL = "https://script.google.com/macros/s/AKfycbzk4LUBXFiVq3U-8ojdCe5Xni9_yYqlPCBb_4X-F6afbJM9S-lV1-2N_ukVxUYYzQytTg/exec";
        const SECRET_PIN = "1549";
        
        let currentUser = 'HT';
        let activeData = [];
        let mfTotals = null;
        let tickerData = { headers: [], rows: [] };
        let currentTab = 'home', currentSubView = 'dashboard', isPrivacyMode = true;
        
        let cashTimestamp = "Never";
        let isEditingCash = false;
        let isEditingNPS = false;
        
        let memoryCache = {}; 
        let domCache = {}; 
        let chartInstances = {}; 
        
        let enteredPin = "";
        function handlePinInput(val) {
            const errorMsg = document.getElementById('pin-error');
            errorMsg.style.display = 'none';
            if (val === 'clear') enteredPin = enteredPin.slice(0, -1);
            else { if (enteredPin.length < 4) enteredPin += val; }
            
            updatePinDisplay();
            if (enteredPin.length === 4) setTimeout(validatePin, 150);
        }

        function updatePinDisplay() {
            const dots = document.querySelectorAll('.pin-circle');
            dots.forEach((dot, idx) => {
                if (idx < enteredPin.length) {
                    dot.style.backgroundColor = 'var(--pico-primary)';
                } else {
                    dot.style.backgroundColor = 'transparent';
                }
            });
        }
        
        function validatePin() {
            if (enteredPin === SECRET_PIN) {
                sessionStorage.setItem('isUnlocked', 'true');
                document.getElementById('pin-overlay').style.display = 'none';
                init();
            } else {
                document.getElementById('pin-error').style.display = 'block';
                enteredPin = "";
                updatePinDisplay();
            }
        }

        const fmt = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
        const monthOrder = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        function applyInitialTheme() {
            const stored = localStorage.getItem('theme');
            const hour = new Date().getHours();
            setTheme(stored || ((hour >= 18 || hour < 6) ? 'dark' : 'light'));
        }
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme); 
            updateIcons();
            updatePinDisplay();
            if (activeData.length > 0 || tickerData.rows.length > 0) renderView();
        }
        function toggleTheme() { 
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            setTheme(isDark ? 'light' : 'dark'); 
        }

        function updateIcons() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.getElementById('theme-icon').innerHTML = isDark 
                ? `<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />` 
                : `<path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />`;
            document.getElementById('privacy-icon').innerHTML = isPrivacyMode 
                ? `<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268-2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>` 
                : `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268-2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>`;
        }

        function switchUser(user, skipFetch = false) {
            currentUser = user;
            localStorage.setItem('currentUser', currentUser);
            
            const slider = document.getElementById('toggle-slider');
            const btnHt = document.getElementById('btn-user-ht');
            const btnNct = document.getElementById('btn-user-nct');
            
            if (user === 'HT') {
                slider.style.transform = 'translateX(0)';
                btnHt.classList.add('active'); btnNct.classList.remove('active');
            } else {
                slider.style.transform = 'translateX(100%)';
                btnNct.classList.add('active'); btnHt.classList.remove('active');
            }
            if (!skipFetch && currentTab !== 'home') switchMainTab(currentTab);
        }

        function applyData(tab, data) {
            if (tab === 'home') {
                activeData = data.assets || []; 
                tickerData = data.tickers || { headers: [], rows: [] };
            } else if (tab === 'cash') {
                activeData = data.items || []; 
                cashTimestamp = data.lastUpdated || "Never";
            } else if (tab === 'nps') {
                activeData = data.items || []; 
            } else if (tab === 'mf') {
                activeData = currentUser === 'HT' ? (data.ht || []) : (data.nct || []);
                mfTotals = currentUser === 'HT' ? (data.htMarketCap || null) : (data.nctMarketCap || null);
            } else {
                activeData = data;
                tickerData = { headers: [], rows: [] };
            }
        }

        async function switchMainTab(tab) {
            currentTab = tab;
            localStorage.setItem('lastActiveTab', tab);
            isEditingCash = false; isEditingNPS = false; 
            
            const titles = { 
                'home': 'Net Worth', 
                'fds': currentUser === 'HT' ? "Hitesh FD's" : "NCT FD's", 
                'ncd': 'HT NCDs', 
                'mf': currentUser === 'HT' ? 'HT MF SIPs' : 'NCT MF SIPs',
                'cash': currentUser === 'HT' ? 'HT Cash' : 'NCT Cash', 
                'nps': currentUser === 'HT' ? 'HT NPS' : 'NCT NPS' 
            };
            document.getElementById('header-title').innerText = titles[tab];
            
            const subNav = document.getElementById('sub-nav');
            const profileToggle = document.getElementById('profile-toggle');
            
            profileToggle.style.display = tab === 'home' ? 'none' : 'flex';
            subNav.style.display = 'flex'; 
            
            const mainContent = document.getElementById('app-content');
            if (tab === 'home' || tab === 'cash' || tab === 'nps') {
                mainContent.style.paddingTop = '115px';
            } else {
                mainContent.style.paddingTop = '160px';
            }

            if (tab === 'home') {
                let savedSubView = localStorage.getItem('lastActiveSubView') || 'dashboard';
                currentSubView = ['dashboard', 'networth', 'tickers'].includes(savedSubView) ? savedSubView : 'dashboard';
                subNav.innerHTML = `
                    <button onclick="showSubView('dashboard')" class="${currentSubView === 'dashboard' ? 'active' : ''}" id="btn-dashboard">Dashboard</button>
                    <button onclick="showSubView('networth')" class="${currentSubView === 'networth' ? 'active' : ''}" id="btn-networth">Net Worth</button>
                    <button onclick="showSubView('tickers')" class="${currentSubView === 'tickers' ? 'active' : ''}" id="btn-tickers">Tickers</button>`;
            } else if (tab === 'mf') {
                let savedSubView = localStorage.getItem('lastActiveSubView') || 'dashboard';
                currentSubView = ['dashboard', 'details'].includes(savedSubView) ? savedSubView : 'dashboard';
                subNav.innerHTML = `
                    <button onclick="showSubView('dashboard')" class="${currentSubView === 'dashboard' ? 'active' : ''}" id="btn-dashboard">Market Cap</button>
                    <button onclick="showSubView('details')" class="${currentSubView === 'details' ? 'active' : ''}" id="btn-details">SIP Details</button>`;
            } else if (tab === 'cash' || tab === 'nps') {
                currentSubView = tab; subNav.style.display = 'none'; 
            } else {
                let savedSubView = localStorage.getItem('lastActiveSubView') || 'maturity';
                currentSubView = ['maturity', 'bank'].includes(savedSubView) ? savedSubView : 'maturity';
                const bankText = (tab === 'ncd') ? 'NBFC-wise' : 'Bank-wise';
                subNav.innerHTML = `
                    <button onclick="showSubView('maturity')" class="${currentSubView === 'maturity' ? 'active' : ''}" id="btn-maturity">Maturity</button>
                    <button onclick="showSubView('bank')" class="${currentSubView === 'bank' ? 'active' : ''}" id="btn-bank">${bankText}</button>`;
            }

            const backBtn = document.getElementById('fab-back');
            if (backBtn) backBtn.style.display = tab === 'home' ? 'none' : 'flex';

            ['home', 'fds', 'ncd', 'mf', 'cash', 'nps'].forEach(t => {
                const el = document.getElementById('nav-' + t);
                if(el) { el.classList.remove('active'); if(t===tab) el.classList.add('active'); }
            });

            const reqTabKey = tab === 'home' ? tab : (tab === 'mf' ? 'mf_data' : tab + '_' + currentUser);

            if (memoryCache[reqTabKey]) {
                applyData(tab, memoryCache[reqTabKey].rawData); updateStats(); renderView(); return;
            }

            document.getElementById('loading-spinner').style.display = 'flex';
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('global-stats').innerHTML = 'Fetching data...';
            
            const paramMap = { 
                'home': 'HOME', 'fds': currentUser === 'HT' ? 'HT' : 'NCT', 
                'ncd': 'NCD', 'cash': currentUser === 'HT' ? 'CASH_HT' : 'CASH_NCT', 
                'nps': currentUser === 'HT' ? 'NPS_HT' : 'NPS_NCT' 
            };

            let networkDataReceived = false;
            try {
                let data;
                if (tab === 'mf') {
                    const urls = [`${API_URL}?action=getHTSips`, `${API_URL}?action=getNCTSips`, `${API_URL}?action=getHTMarketCap`, `${API_URL}?action=getNCTMarketCap`];
                    const [ht, nct, htMarketCap, nctMarketCap] = await Promise.all(urls.map(url => fetch(url).then(r => r.json())));
                    data = { ht, htMarketCap, nct, nctMarketCap };
                    networkDataReceived = true;
                    memoryCache[reqTabKey] = { rawData: data };
                    const cache = await caches.open('ai-tracker-data-v1');
                    cache.put(`${API_URL}?action=getMFs`, new Response(JSON.stringify(data)));
                } else {
                    const reqUrl = `${API_URL}?user=${paramMap[tab]}`;
                    caches.open('ai-tracker-data-v1').then(cache => {
                        cache.match(reqUrl).then(response => {
                            if (response) {
                                response.json().then(cachedData => {
                                    if (!networkDataReceived) {
                                        applyData(tab, cachedData); updateStats(); renderView();
                                    }
                                }).catch(() => {}); 
                            }
                        });
                    });
                    const response = await fetch(reqUrl);
                    data = await response.json();
                    if (data.error) throw new Error(data.error);
                    
                    networkDataReceived = true; memoryCache[reqTabKey] = { rawData: data };
                    const cache = await caches.open('ai-tracker-data-v1');
                    cache.put(reqUrl, new Response(JSON.stringify(data)));
                }

                if (currentTab === tab) {
                    if (!isEditingCash && !isEditingNPS) {
                        applyData(tab, data); updateStats(); 
                        Object.keys(domCache).forEach(key => { if (key.startsWith(reqTabKey + '_')) { domCache[key].remove(); delete domCache[key]; } });
                        renderView();
                    }
                }
            } catch (e) {
                if (!networkDataReceived) {
                    document.getElementById('loading-spinner').style.display = 'none';
                    document.getElementById('app-content').style.display = 'block';
                    document.getElementById('app-content').innerHTML = `<div class="card"><div class="card-header" style="color:var(--pico-del-color);">Connection Error</div><div style="padding:1rem; text-align:center;"><small>${e.message}</small></div></div>`;
                    document.getElementById('global-stats').innerHTML = 'Error loading';
                }
            }
        }

        function showSubView(view) {
            currentSubView = view;
            localStorage.setItem('lastActiveSubView', view);
            
            if (currentTab === 'home') {
                ['dashboard', 'networth', 'tickers'].forEach(v => {
                    const btn = document.getElementById('btn-'+v);
                    if(btn) { btn.classList.remove('active'); if(v===view) btn.classList.add('active'); }
                });
            } else if (currentTab === 'mf') {
                ['dashboard', 'details'].forEach(v => {
                    const btn = document.getElementById('btn-'+v);
                    if(btn) { btn.classList.remove('active'); if(v===view) btn.classList.add('active'); }
                });
            } else if (currentTab !== 'cash' && currentTab !== 'nps') {
                ['maturity', 'bank'].forEach(v => {
                    const btn = document.getElementById('btn-'+v);
                    if(btn) { btn.classList.remove('active'); if(v===view) btn.classList.add('active'); }
                });
            }
            renderView();
        }

        function togglePrivacy() { 
            isPrivacyMode = !isPrivacyMode; updateIcons(); updateStats(); 
            domCache = {}; document.getElementById('app-content').innerHTML = ''; renderView(); 
        }

        function displayMoney(amt) {
            if (typeof amt === 'string' && amt.includes('%')) return isPrivacyMode && !isEditingCash && !isEditingNPS ? amt.replace(/[0-9]/g, '●') : amt;
            return isPrivacyMode && !isEditingCash && !isEditingNPS ? fmt.format(amt).replace(/[0-9]/g, '●') : fmt.format(amt); 
        }

        function init() { 
            let savedUser = localStorage.getItem('currentUser') || 'HT'; switchUser(savedUser, true);
            const savedTab = localStorage.getItem('lastActiveTab') || 'home'; switchMainTab(savedTab);
        }

        function updateStats() {
            let total = 0;
            if (currentTab === 'mf') {
                if (activeData && activeData.active) total = activeData.active.reduce((s, item) => s + (item.totalAmount || 0), 0);
            } else if (Array.isArray(activeData)) {
                total = activeData.reduce((s, item) => s + (item.totalAmount !== undefined ? item.totalAmount : (item.total !== undefined ? parseFloat(item.total) || 0 : item.amount)), 0);
            }

            if (currentTab === 'home' || currentTab === 'cash' || currentTab === 'nps') document.getElementById('global-stats').innerHTML = `Total: ${displayMoney(total)}`;
            else if (currentTab === 'mf') document.getElementById('global-stats').innerHTML = `Active SIPs: ${displayMoney(total)}`;
            else if (currentTab === 'ncd') document.getElementById('global-stats').innerHTML = `Inv: ${displayMoney(total)}`;
            else {
                let mat = 0;
                if (Array.isArray(activeData)) mat = activeData.reduce((s, f) => s + (f.maturityAmount || 0), 0);
                document.getElementById('global-stats').innerHTML = `Inv: ${displayMoney(total)} | Mat: ${displayMoney(mat)}`;
            }
        }

        const tealPalette = ['#0f766e', '#0d9488', '#14b8a6', '#2dd4bf', '#5eead4', '#99f6e4', '#ccfbf1'];

        function renderSharedChart(canvasId, labels, data, totalValue) {
            const ctx = document.getElementById(canvasId);
            if (!ctx) return;
            if (chartInstances[canvasId]) chartInstances[canvasId].destroy();
            
            const sliceLabelPlugin = {
                id: 'sliceLabels',
                afterDatasetsDraw(chart) {
                    const { ctx, data } = chart;
                    ctx.save();
                    const meta = chart.getDatasetMeta(0);
                    const total = data.datasets[0].data.reduce((a, b) => a + b, 0);

                    meta.data.forEach((element, index) => {
                        const value = data.datasets[0].data[index];
                        const percentage = total > 0 ? (value / total) : 0;
                        if (percentage > 0.05) {
                            const centerPoint = element.tooltipPosition();
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; 
                            ctx.font = '600 10px system-ui, -apple-system, sans-serif';
                            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)'; ctx.shadowBlur = 4;
                            let labelText = data.labels[index];
                            if (labelText.length > 12) labelText = labelText.substring(0, 10) + '..';
                            ctx.fillText(labelText, centerPoint.x, centerPoint.y);
                        }
                    });
                    ctx.restore();
                }
            };

            chartInstances[canvasId] = new Chart(ctx, { 
                type: 'doughnut', 
                data: { labels: labels, datasets: [{ data: data, backgroundColor: tealPalette.slice(0, labels.length), borderWidth: 0, hoverOffset: 4 }] },
                plugins: [sliceLabelPlugin],
                options: { 
                    responsive: true, maintainAspectRatio: true, cutout: '65%', 
                    plugins: { 
                        legend: { display: false }, 
                        tooltip: { callbacks: { label: function(context) { const val = context.raw; const pct = totalValue > 0 ? (val / totalValue * 100).toFixed(1) + '%' : '0%'; return ` ${context.label}: ${displayMoney(val)} (${displayMoney(pct)})`; } } }
                    }
                }
            });
        }

        function renderView() {
            document.getElementById('loading-spinner').style.display = 'none';
            const container = document.getElementById('app-content');
            container.style.display = 'block';

            const reqTabKey = currentTab === 'home' ? currentTab : (currentTab === 'mf' ? 'mf_data_' + currentUser : currentTab + '_' + currentUser);
            const viewKey = reqTabKey + '_' + currentSubView;

            Array.from(container.children).forEach(child => child.style.display = 'none');
            
            const hasTickers = currentTab === 'home' && currentSubView === 'tickers' && tickerData.rows.length > 0;
            if (activeData.length === 0 && !hasTickers && !mfTotals) { 
                container.innerHTML = '<div class="text-center text-muted" style="padding:3rem;"><small>No active records found.</small></div>';
                domCache = {}; return; 
            }

            if (domCache[viewKey]) { domCache[viewKey].style.display = 'block'; return; }

            const viewDiv = document.createElement('div');
            viewDiv.id = 'view-' + viewKey;
            container.appendChild(viewDiv);
            domCache[viewKey] = viewDiv;

            if (currentTab === 'home') {
                if (currentSubView === 'dashboard') renderDashboard(viewDiv);
                else if (currentSubView === 'networth') renderHome(viewDiv); 
                else if (currentSubView === 'tickers') renderTickers(viewDiv);
            } else if (currentTab === 'cash') renderCash(viewDiv);
            else if (currentTab === 'nps') renderNPS(viewDiv);
            else if (currentTab === 'mf') {
                if (currentSubView === 'dashboard') renderMFDashboard(viewDiv);
                else renderMFDetails(viewDiv);
            } else {
                if (currentSubView === 'maturity') renderMaturity(viewDiv);
                else renderBankOrCompany(viewDiv);
            }
        }

        function renderMFDashboard(container) {
            if (!mfTotals) return;
            const labels = ['Large Cap', 'Mid Cap', 'Small Cap'];
            const chartData = [mfTotals.large, mfTotals.mid, mfTotals.small];
            const totalInv = mfTotals.total;
            if (mfTotals.other > (totalInv * 0.01)) { labels.push('Other / Debt'); chartData.push(mfTotals.other); }

            const canvasId = `chart-${currentTab}_${currentUser}-${currentSubView}`;
            
            let html = `
                <div class="card">
                    <div class="card-header">Market Cap Allocation</div>
                    <div style="padding: 1rem;">
                        <div style="max-width:220px; margin:0 auto;"><canvas id="${canvasId}"></canvas></div>
                        <div class="text-center text-xs text-muted font-bold" style="margin-top:1rem;">Total Invested: ${displayMoney(totalInv)}</div>
                    </div>
                </div>
                <div class="card">
                    <ul class="list-container">`;
            
            labels.forEach((label, i) => {
                const amount = chartData[i]; const percent = totalInv > 0 ? (amount / totalInv * 100).toFixed(2) + '%' : '0.00%';
                html += `
                <li class="list-row">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:${tealPalette[i % tealPalette.length]}; flex-shrink:0;"></span>
                        <strong class="text-sm">${label}</strong>
                    </div>
                    <div class="text-right flex-col">
                        <strong class="text-sm">${displayMoney(amount)}</strong>
                        <span class="text-xs text-muted font-bold mt-1">${displayMoney(percent)}</span>
                    </div>
                </li>`;
            });
            html += `</ul></div>`;
            container.innerHTML = html; renderSharedChart(canvasId, labels, chartData, totalInv);
        }

        function renderMFDetails(container, fundsDataObj) {
            const dataToRender = fundsDataObj || activeData; 
            let finalHtml = '';

            const buildSection = (fundList, title) => {
                if (!fundList || fundList.length === 0) return '';
                let html = `<div class="card-header" style="background: transparent; border:none; text-align:left; padding: 1rem 0.5rem 0.5rem;">${title}</div>`;
                
                fundList.forEach(fund => {
                    let sipsHtml = fund.details.map(sip => {
                        return `<tr><td>${sip.plan}</td><td class="text-muted text-center">${sip.startDate}</td><td class="text-muted text-center">${sip.endDate}</td><td class="text-right"><strong>${displayMoney(sip.amount)}</strong></td></tr>`;
                    }).join('');

                    let pType = fund.planType || '-'; let expRatio = fund.expenseRatio ? fund.expenseRatio : '-';
                    if (expRatio !== '-' && !String(expRatio).includes('%')) expRatio += '%';
                    let lPct = fund.large !== undefined ? (Number(fund.large).toFixed(2) + '%') : '-';
                    let mPct = fund.medium !== undefined ? (Number(fund.medium).toFixed(2) + '%') : '-';
                    let sPct = fund.small !== undefined ? (Number(fund.small).toFixed(2) + '%') : '-';
                    let alphaVal = (fund.alphaEfficiency !== undefined && fund.alphaEfficiency !== null && fund.alphaEfficiency !== '') ? fund.alphaEfficiency : '-';

                    html += `
                    <details>
                        <summary>
                            <span class="text-sm" style="flex:1; padding-right:10px; line-height:1.2;">${fund.fund}</span>
                            <span class="pill">${displayMoney(fund.totalAmount)}</span>
                        </summary>
                        <div style="padding: 10px;">
                            <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:0.5rem; text-align:center; background:var(--pico-form-element-background-color); padding:0.5rem; border-radius:6px; margin-bottom:10px;">
                                <div><span class="text-xs text-muted font-bold uppercase">Large</span><br><strong class="text-sm">${lPct}</strong></div>
                                <div><span class="text-xs text-muted font-bold uppercase">Mid</span><br><strong class="text-sm">${mPct}</strong></div>
                                <div><span class="text-xs text-muted font-bold uppercase">Small</span><br><strong class="text-sm">${sPct}</strong></div>
                                <div><span class="text-xs font-bold uppercase" style="color:var(--pico-primary);">Alpha</span><br><strong class="text-sm">${alphaVal}</strong></div>
                            </div>
                            <div class="flex-between text-muted text-xs font-bold" style="margin-bottom:10px; padding:0 5px;"><span>Plan: ${pType}</span><span>Exp: ${expRatio}</span></div>
                            <div class="table-wrapper">
                                <table class="compact">
                                    <thead><tr><th>Plan</th><th class="text-center">Start</th><th class="text-center">End</th><th class="text-right">Amt</th></tr></thead>
                                    <tbody>${sipsHtml}</tbody>
                                </table>
                            </div>
                        </div>
                    </details>`;
                });
                return html;
            };

            if (dataToRender && dataToRender.active !== undefined) {
                finalHtml += buildSection(dataToRender.active, "ACTIVE SIPs");
                finalHtml += buildSection(dataToRender.inactive, "INACTIVE SIPs");
            } else if (Array.isArray(dataToRender)) {
                finalHtml += buildSection(dataToRender, "SIP Details");
            }
            container.innerHTML = finalHtml;
        }

        function renderNPS(container) {
            let tiers = activeData.reduce((acc, item) => {
                let t = item.tier || "Tier 1"; if (!acc[t]) acc[t] = []; acc[t].push(item); return acc;
            }, {});
            
            let html = ``;
            const btnText = isEditingNPS ? "Save Changes" : "Edit Values";

            Object.keys(tiers).sort().forEach(tierName => {
                let latestTimeMs = 0; let tierTimestampStr = "Never";
                tiers[tierName].forEach(item => {
                    if (item.lastUpdated && item.lastUpdated !== "") {
                        let d = new Date(item.lastUpdated).getTime();
                        if (!isNaN(d) && d > latestTimeMs) { latestTimeMs = d; tierTimestampStr = new Date(item.lastUpdated).toLocaleString('en-IN', {dateStyle: 'medium', timeStyle: 'short'}); } 
                        else if (latestTimeMs === 0) tierTimestampStr = item.lastUpdated; 
                    }
                });

                let tbodyHtml = tiers[tierName].map(item => {
                    let globalIdx = activeData.indexOf(item); 
                    let unitsDisplay = isEditingNPS 
                        ? `<input type="number" step="0.001" id="nps-input-${globalIdx}" value="${item.units}" style="width:70px; padding:4px; margin:0 auto; text-align:center; height:auto; min-height:auto; font-size:0.75rem; font-weight:bold;" />`
                        : `<strong>${item.units}</strong>`;
                    
                    let percentStr = item.percent;
                    if (typeof percentStr === 'number') percentStr = Number((percentStr * 100).toFixed(2)) + '%';
                    else if (typeof percentStr === 'string' && percentStr !== "" && !percentStr.includes('%')) {
                        let n = parseFloat(percentStr);
                        if (!isNaN(n) && n > 0 && n < 1) percentStr = Number((n * 100).toFixed(2)) + '%'; else if (!isNaN(n)) percentStr = n + '%';
                    }
                    percentStr = displayMoney(percentStr);
                    let totalDisplay = typeof item.total === 'number' ? displayMoney(item.total) : item.total;
                    let navDateDisplay = item.navDate ? new Date(item.navDate).toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'2-digit'}) : '';

                    return `<tr>
                        <td><strong>${item.fund}</strong><br><span class="text-muted" style="font-size:0.65rem;">${item.scheme}</span></td>
                        <td class="text-center">${percentStr}</td>
                        <td class="text-center" style="color:var(--pico-primary);">${unitsDisplay}</td>
                        <td class="text-center"><span class="text-muted">${item.nav}</span><br><span class="text-muted" style="font-size:0.6rem;">${navDateDisplay}</span></td>
                        <td class="text-right"><strong>${totalDisplay}</strong></td>
                    </tr>`;
                }).join('');

                html += `
                    <div class="flex-between" style="margin-bottom:0.5rem; margin-top:1rem; padding: 0 0.5rem;">
                        <h4 style="margin:0; font-size:0.95rem; font-weight:bold;">${tierName}</h4>
                        <span class="text-muted text-xs font-bold">Updated: ${tierTimestampStr}</span>
                    </div>
                    <div class="card table-wrapper">
                        <table class="compact">
                            <thead><tr><th>Scheme</th><th class="text-center">%</th><th class="text-center">Units</th><th class="text-center">NAV/Date</th><th class="text-right">Total</th></tr></thead>
                            <tbody>${tbodyHtml}</tbody>
                        </table>
                    </div>
                `;
            });
            html += `<div style="text-align:right; margin-top:1rem;"><button id="nps-action-btn" onclick="handleNPSAction()" style="font-weight:bold; font-size:0.8rem; padding: 8px 16px;">${btnText}</button></div>`;
            container.innerHTML = html;
        }

        async function handleNPSAction() {
            const viewKey = currentTab + '_' + currentUser + '_' + currentSubView;
            if (!isEditingNPS) { isEditingNPS = true; if(domCache[viewKey]) { domCache[viewKey].remove(); delete domCache[viewKey]; } renderView(); } 
            else {
                const btn = document.getElementById('nps-action-btn'); btn.setAttribute('aria-busy', 'true'); btn.disabled = true; btn.innerText = "Saving";
                const updates = []; let inputsFound = false;
                
                activeData.forEach((item, index) => {
                    const input = document.getElementById('nps-input-' + index);
                    if(input) { inputsFound = true; const newVal = parseFloat(input.value) || 0; if (item.units !== newVal) { item.units = newVal; updates.push({ row: item.row, col: item.col, dtCol: item.dtCol, units: newVal }); } }
                });
                
                if (inputsFound && updates.length === 0) { isEditingNPS = false; if(domCache[viewKey]) { domCache[viewKey].remove(); delete domCache[viewKey]; } renderView(); return; }
                const targetKeyword = currentUser === 'HT' ? "HT NPS" : "NCT NPS";
                try {
                    const response = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "UPDATE_NPS", keyword: targetKeyword, updates: updates }) });
                    const result = await response.json();
                    if(result.error) throw new Error(result.error);
                    
                    isEditingNPS = false;
                    if (result.timestamp) updates.forEach(u => { let match = activeData.find(a => a.row === u.row); if (match) match.lastUpdated = result.timestamp; });
                    const freshData = { items: activeData }; memoryCache[currentTab + '_' + currentUser] = { rawData: freshData };
                    const reqUrl = `${API_URL}?user=${targetKeyword === 'HT NPS' ? 'NPS_HT' : 'NPS_NCT'}`;
                    caches.open('ai-tracker-data-v1').then(cache => { cache.put(reqUrl, new Response(JSON.stringify(freshData))); });
                    if(domCache[viewKey]) { domCache[viewKey].remove(); delete domCache[viewKey]; }
                    updateStats(); renderView();
                } catch(e) { alert("Save failed: " + e.message); btn.removeAttribute('aria-busy'); btn.disabled = false; btn.innerText = "Save Changes"; }
            }
        }

        function renderCash(container) {
            let tbodyHtml = activeData.map((item, index) => {
                let amountDisplay = isEditingCash ? `<input type="number" id="cash-input-${index}" value="${item.amount}" style="width:90px; padding:4px; text-align:right; margin:0; height:auto; min-height:auto; font-size:0.75rem; font-weight:bold;" />` : `<strong>${displayMoney(item.amount)}</strong>`;
                let formattedRate = item.interest;
                if (typeof formattedRate === 'number') formattedRate = Number((formattedRate * 100).toFixed(2)) + '%';
                else if (typeof formattedRate === 'string' && formattedRate !== "" && formattedRate !== "N/A" && !formattedRate.includes('%')) { let num = parseFloat(formattedRate); if (!isNaN(num) && num > 0 && num < 1) formattedRate = Number((num * 100).toFixed(2)) + '%'; else if (!isNaN(num)) formattedRate = num + '%'; }
                formattedRate = displayMoney(formattedRate);
                
                return `<tr><td><strong>${item.bank}</strong></td><td class="text-right">${amountDisplay}</td><td class="text-right text-muted">${formattedRate}</td></tr>`;
            }).join('');

            const btnText = isEditingCash ? "Save Changes" : "Edit Values";
            container.innerHTML = `
                <div style="text-align:right; margin-bottom:0.5rem; padding: 0 0.5rem;"><span class="text-muted text-xs font-bold">Last Updated: ${cashTimestamp}</span></div>
                <div class="card table-wrapper">
                    <table class="compact">
                        <thead><tr><th>Bank</th><th class="text-right">Amount</th><th class="text-right">Interest</th></tr></thead>
                        <tbody>${tbodyHtml}</tbody>
                    </table>
                </div>
                <div style="text-align:right; margin-top:1rem;"><button id="cash-action-btn" onclick="handleCashAction()" style="font-weight:bold; font-size:0.8rem; padding: 8px 16px;">${btnText}</button></div>
            `;
        }

        async function handleCashAction() {
            const viewKey = currentTab + '_' + currentUser + '_' + currentSubView;
            if (!isEditingCash) { isEditingCash = true; if(domCache[viewKey]) { domCache[viewKey].remove(); delete domCache[viewKey]; } renderView(); } 
            else {
                const btn = document.getElementById('cash-action-btn'); btn.setAttribute('aria-busy', 'true'); btn.disabled = true; btn.innerText = "Saving";
                const updates = [];
                activeData.forEach((item, index) => { const input = document.getElementById('cash-input-' + index); if(input) { const newVal = parseFloat(input.value) || 0; item.amount = newVal; updates.push({ row: item.row, col: item.col, amount: newVal }); } });
                const targetKeyword = currentUser === 'HT' ? "HT Cash" : "NCT Cash";
                try {
                    const response = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "UPDATE_CASH", keyword: targetKeyword, updates: updates }) });
                    const result = await response.json();
                    if(result.error) throw new Error(result.error);
                    cashTimestamp = result.timestamp; isEditingCash = false;
                    const freshData = { items: activeData, lastUpdated: cashTimestamp }; memoryCache[currentTab + '_' + currentUser] = { rawData: freshData };
                    const reqUrl = `${API_URL}?user=${targetKeyword === 'HT Cash' ? 'CASH_HT' : 'CASH_NCT'}`;
                    caches.open('ai-tracker-data-v1').then(cache => { cache.put(reqUrl, new Response(JSON.stringify(freshData))); });
                    if(domCache[viewKey]) { domCache[viewKey].remove(); delete domCache[viewKey]; }
                    updateStats(); renderView();
                } catch(e) { alert("Save failed: " + e.message); btn.removeAttribute('aria-busy'); btn.disabled = false; btn.innerText = "Save Changes"; }
            }
        }

        function renderDashboard(viewDiv) {
            const grandTotal = activeData.reduce((sum, item) => sum + item.amount, 0);
            const classTotals = activeData.reduce((acc, item) => { const aClass = item.assetClass && item.assetClass !== '-' ? item.assetClass.trim() : 'Others'; acc[aClass] = (acc[aClass] || 0) + item.amount; return acc; }, {});
            const sortedClasses = Object.keys(classTotals).sort((a, b) => classTotals[b] - classTotals[a]);
            const chartData = sortedClasses.map(key => classTotals[key]);
            const canvasId = `chart-${currentTab}-${currentSubView}`;
            
            let html = `
                <div class="card">
                    <div class="card-header">Asset Allocation</div>
                    <div style="padding: 1rem;">
                        <div style="max-width:220px; margin:0 auto;"><canvas id="${canvasId}"></canvas></div>
                    </div>
                </div>
                <div class="card">
                    <ul class="list-container">`;
            
            sortedClasses.forEach((label, i) => {
                const amount = classTotals[label]; const percent = grandTotal > 0 ? (amount / grandTotal * 100).toFixed(1) + '%' : '0.0%';
                html += `
                <li class="list-row">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:${tealPalette[i % tealPalette.length]}; flex-shrink:0;"></span>
                        <strong class="text-sm">${label}</strong>
                    </div>
                    <div class="text-right flex-col">
                        <strong class="text-sm">${displayMoney(amount)}</strong>
                        <span class="text-xs text-muted font-bold mt-1">${displayMoney(percent)}</span>
                    </div>
                </li>`;
            });
            html += `</ul></div>`; 
            viewDiv.innerHTML = html; renderSharedChart(canvasId, sortedClasses, chartData, grandTotal);
        }

        function renderHome(container) {
            const totalAmount = activeData.reduce((sum, item) => sum + item.amount, 0);
            const sortedData = [...activeData].sort((a, b) => b.amount - a.amount);
            
            let html = `
                <div class="card">
                    <div class="card-header flex-between" style="padding: 10px 16px;">
                        <span style="flex:1; text-align:left;">Asset</span>
                        <span style="width:60px; text-align:center;">Class</span>
                        <span style="flex:1; text-align:right;">Allocation</span>
                    </div>
                    <ul class="list-container">`;

            sortedData.forEach(item => {
                const percent = totalAmount > 0 ? (item.amount / totalAmount * 100).toFixed(2) + '%' : '0.00%';
                html += `
                <li class="list-row">
                    <div style="flex:1; padding-right:10px;">
                        <strong class="text-sm" style="line-height:1.2; display:block;">${item.asset}</strong>
                    </div>
                    <div style="width:60px; text-align:center;">
                        <span class="text-xs text-muted font-bold">${item.assetClass || '-'}</span>
                    </div>
                    <div class="text-right flex-col" style="flex:1; padding-left:10px;">
                        <strong class="text-sm">${displayMoney(item.amount)}</strong>
                        <span class="text-xs text-muted font-bold mt-1">${displayMoney(percent)}</span>
                    </div>
                </li>`;
            });
            container.innerHTML = html + `</ul></div>`;
        }

       function renderTickers(container) {
            if (!tickerData || !tickerData.rows || tickerData.rows.length === 0) { container.innerHTML = '<div class="text-center text-muted" style="padding:3rem;"><small>No ticker data found.</small></div>'; return; }
            const tickerFmt = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
            let theadHtml = `<tr><th>TICKER</th>`;
            for (let i = 1; i < tickerData.headers.length; i++) theadHtml += `<th class="text-right">${String(tickerData.headers[i]).toUpperCase()}</th>`; 
            theadHtml += `</tr>`;
            
            let tbodyHtml = tickerData.rows.map(row => {
                let rowHtml = `<tr><td><strong>${row.ticker}</strong></td>`;
                row.values.forEach((val, idx) => {
                    const headerName = String(tickerData.headers[idx + 1]).toUpperCase(); let displayVal = val; let colorClass = "";
                    if (headerName.includes('%')) { 
                        let num = parseFloat(val); 
                        if (!isNaN(num)) {
                            if (typeof val === 'number' || (typeof val === 'string' && !val.includes('%'))) displayVal = (num * 100).toFixed(2) + '%'; 
                            if (num > 0) { colorClass = "text-green"; if (!displayVal.toString().startsWith('+')) displayVal = "+" + displayVal; } 
                            else if (num < 0) { colorClass = "text-red"; } 
                            else { colorClass = "text-muted font-bold"; }
                        }
                    } else { let num = parseFloat(val); if (!isNaN(num)) displayVal = tickerFmt.format(num); }
                    rowHtml += `<td class="text-right ${colorClass}">${displayVal}</td>`;
                });
                return rowHtml + `</tr>`;
            }).join('');
            container.innerHTML = `<div class="card table-wrapper"><table class="compact"><thead>${theadHtml}</thead><tbody>${tbodyHtml}</tbody></table></div>`;
        }

        function renderMaturity(container) {
            const grandTotalVal = activeData.reduce((sum, item) => sum + (currentTab === 'ncd' ? item.amount : item.maturityAmount), 0);
            const groups = activeData.reduce((acc, item) => {
                const d = new Date(item.maturityDate), y = d.getFullYear(), m = d.toLocaleString('default', { month: 'long' });
                if(!acc[y]) acc[y] = { months: {}, total: 0 }; if(!acc[y].months[m]) acc[y].months[m] = { items: [], total: 0 };
                acc[y].months[m].items.push(item); acc[y].total += (currentTab === 'ncd' ? item.amount : item.maturityAmount); acc[y].months[m].total += (currentTab === 'ncd' ? item.amount : item.maturityAmount); return acc;
            }, {});
            
            const chartLabels = []; const chartData = [];
            Object.keys(groups).sort().forEach(y => { chartLabels.push(y); chartData.push(groups[y].total); });
            const canvasId = `chart-${currentTab}_${currentUser}-${currentSubView}`;
            
            let html = `
                <div class="card">
                    <div class="card-header">Maturity Timeline</div>
                    <div style="padding: 1rem;">
                        <div style="max-width:200px; margin:0 auto;"><canvas id="${canvasId}"></canvas></div>
                    </div>
                </div>`;
            
            Object.keys(groups).sort().forEach(y => {
                const yearlyTotal = groups[y].total; const yearPercent = grandTotalVal > 0 ? (yearlyTotal / grandTotalVal * 100).toFixed(1) : '0.0';
                html += `
                <details>
                    <summary>
                        <span style="font-size: 1.1rem;">${y}</span> 
                        <span class="text-muted" style="font-size:0.8rem; text-align:right;">${displayMoney(yearPercent + '%')}, <strong style="color:var(--pico-color);">${displayMoney(yearlyTotal)}</strong></span>
                    </summary>
                    <div>`;
                Object.keys(groups[y].months).sort((a, b) => monthOrder.indexOf(a) - monthOrder.indexOf(b)).forEach(m => {
                    groups[y].months[m].items.sort((a, b) => new Date(a.maturityDate) - new Date(b.maturityDate));
                    const monthlyTotal = groups[y].months[m].total; const percent = yearlyTotal > 0 ? (monthlyTotal / yearlyTotal * 100).toFixed(1) : '0.0';
                    html += `
                    <details style="margin: 0 0 0 10px; border-radius:0; border:none; border-left: 3px solid var(--pico-primary); background: transparent;">
                        <summary style="font-size: 0.85rem; border-bottom: 1px solid var(--pico-muted-border-color); padding: 10px;">
                            <span>${m}</span> 
                            <span class="text-muted" style="font-size:0.75rem;">${displayMoney(percent + '%')}, <strong style="color:var(--pico-color);">${displayMoney(monthlyTotal)}</strong></span>
                        </summary>
                        <div class="table-wrapper" style="padding:0;">${renderTable(groups[y].months[m].items)}</div>
                    </details>`;
                });
                html += `</div></details>`;
            });
            container.innerHTML = html; renderSharedChart(canvasId, chartLabels, chartData, grandTotalVal);
        }

        function renderBankOrCompany(container) {
            const grandTotalInv = activeData.reduce((sum, item) => sum + item.amount, 0);
            const groups = activeData.reduce((acc, item) => {
                const groupKey = currentTab === 'ncd' ? item.company : item.bank;
                if(!acc[groupKey]) { acc[groupKey] = { items: [], total: 0, inv: 0, weightedRateSum: 0, weightedInv: 0 }; }
                acc[groupKey].items.push(item); acc[groupKey].inv += item.amount;
                let rateNum = parseFloat(String(item.rate).replace('%', ''));
                if (!isNaN(rateNum)) { acc[groupKey].weightedRateSum += (item.amount * rateNum); acc[groupKey].weightedInv += item.amount; }
                if (currentTab !== 'ncd') acc[groupKey].total += item.maturityAmount;
                return acc;
            }, {});

            const sortedBanks = Object.keys(groups).sort((a, b) => groups[b].inv - groups[a].inv);
            const chartLabels = sortedBanks; const chartData = sortedBanks.map(k => groups[k].inv);
            const canvasId = `chart-${currentTab}_${currentUser}-${currentSubView}`;
            
            let html = '';
            if (currentTab !== 'ncd') {
                html += `
                <div class="card">
                    <div class="card-header">Bank Allocation</div>
                    <div style="padding: 1rem;">
                        <div style="max-width:200px; margin:0 auto;"><canvas id="${canvasId}"></canvas></div>
                    </div>
                </div>`;
            }

            sortedBanks.forEach(key => {
                groups[key].items.sort((a, b) => new Date(a.maturityDate) - new Date(b.maturityDate));
                const weightedAvgRate = (groups[key].weightedInv > 0) ? (groups[key].weightedRateSum / groups[key].weightedInv).toFixed(2) + '%' : 'N/A';
                const percentOfTotal = (grandTotalInv > 0) ? (groups[key].inv / grandTotalInv * 100).toFixed(1) + '%' : '0.0%';
               
                const mRate = displayMoney(weightedAvgRate); const mPercent = displayMoney(percentOfTotal);
                let statsHtml = currentTab === 'ncd' 
                    ? `<strong>${mPercent}</strong> | Rate: <strong>${mRate}</strong>` 
                    : `<strong>${mPercent}</strong> | Inv: <strong>${displayMoney(groups[key].inv)}</strong> | Rate: <strong>${mRate}</strong>`;
                let pillAmount = currentTab === 'ncd' ? displayMoney(groups[key].inv) : displayMoney(groups[key].total);

                html += `
                <details>
                    <summary>
                        <div style="line-height:1.4; flex:1; padding-right:10px;">
                            <span class="text-sm">${key}</span><br>
                            <span class="text-muted" style="font-size:0.65rem; font-weight:normal;">${statsHtml}</span>
                        </div>
                        <span class="pill">${pillAmount}</span>
                    </summary>
                    <div class="table-wrapper">${renderTable(groups[key].items)}</div>
                </details>`;
            });
            container.innerHTML = html; 
            if (currentTab !== 'ncd') renderSharedChart(canvasId, chartLabels, chartData, grandTotalInv);
        }

        function renderTable(items) {
            const isNCD = currentTab === 'ncd';
            const isMaturity = currentSubView === 'maturity';
            
            let theadHtml = `<tr>
                ${isMaturity ? `<th class="text-left">${isNCD ? 'NBFC' : 'BANK'}</th>` : ''}
                <th class="text-center">Amt</th>
                ${!isNCD ? `<th class="text-center">Mat.Amt</th>` : ''}
                <th class="text-center">Date</th>
                <th class="text-right">Rate</th>
            </tr>`;
            
            let tbodyHtml = items.map(item => {
                let formattedRate = String(item.rate); 
                if (!formattedRate.includes('%') && formattedRate !== 'N/A') formattedRate += '%';
                formattedRate = displayMoney(formattedRate);
                let compactDate = new Date(item.maturityDate).toLocaleDateString('en-GB', {day:'2-digit', month:'2-digit', year:'2-digit'});

                return `<tr>
                    ${isMaturity ? `<td class="text-left text-muted" style="font-size:0.65rem; max-width:80px;">${isNCD ? item.company : item.bank}</td>` : ''}
                    <td class="text-center text-sm"><strong>${displayMoney(item.amount)}</strong></td>
                    ${!isNCD ? `<td class="text-center text-sm"><strong>${displayMoney(item.maturityAmount)}</strong></td>` : ''}
                    <td class="text-center text-muted" style="font-size:0.7rem;">${compactDate}</td>
                    <td class="text-right" style="color:var(--pico-primary); font-size:0.75rem; font-weight:bold;">${formattedRate}</td>
                </tr>`;
            }).join('');
            
            return `<table class="compact"><thead>${theadHtml}</thead><tbody>${tbodyHtml}</tbody></table>`;
        }
    </script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action'); const rows = urlParams.get('rows');
        if (action === 'markCompleted' && rows) {
            window.history.replaceState({}, document.title, window.location.pathname);
            const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzk4LUBXFiVq3U-8ojdCe5Xni9_yYqlPCBb_4X-F6afbJM9S-lV1-2N_ukVxUYYzQytTg/exec";
            fetch(`${GOOGLE_SCRIPT_URL}?action=markCompleted&rows=${rows}`).catch(error => console.error(error));
        }
    });
    </script>
</body>
</html>
